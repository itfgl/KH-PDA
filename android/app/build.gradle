apply plugin: 'com.android.application'
import groovy.json.JsonSlurper

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("../keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

def releaseManifestFile = rootProject.file("../release-manifest.json")
if (!releaseManifestFile.exists()) {
    throw new GradleException("release-manifest.json not found")
}
def releaseManifest = new JsonSlurper().parse(releaseManifestFile)
def currentVersionCodeFromManifest = (releaseManifest.currentVersionCode ?: 1) as Integer
def releaseEntries = (releaseManifest.releases ?: []) as List
def currentRelease = releaseEntries.find { entry ->
    ((entry.versionCode ?: 0) as Integer) == currentVersionCodeFromManifest
}
if (currentRelease == null) {
    throw new GradleException("Current release versionCode ${currentVersionCodeFromManifest} not found in release-manifest.json")
}

def appVersionCode = currentVersionCodeFromManifest
def appVersionName = (currentRelease.versionName ?: "1.0.0").toString()

def signingValue = { envName, propertyName ->
    def envValue = System.getenv(envName)
    if (envValue != null && !envValue.trim().isEmpty()) {
        return envValue
    }
    return keystoreProperties.getProperty(propertyName)
}

def releaseStoreFilePath = signingValue("RELEASE_STORE_FILE", "storeFile")
def releaseStorePassword = signingValue("RELEASE_STORE_PASSWORD", "storePassword")
def releaseKeyAlias = signingValue("RELEASE_KEY_ALIAS", "keyAlias")
def releaseKeyPassword = signingValue("RELEASE_KEY_PASSWORD", "keyPassword")
def hasReleaseSigning = [
    releaseStoreFilePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { it != null && !it.trim().isEmpty() }

android {
    namespace = "com.kaihang.scanner"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.kaihang.scanner"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        buildConfigField "String", "BUILD_TIME", "\"${new Date().format("yyyy-MM-dd HH:mm:ss Z")}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def wantsReleaseBuild = graph.allTasks.any { task ->
        task.name.toLowerCase().contains("release")
    }
    if (wantsReleaseBuild && !hasReleaseSigning) {
        throw new GradleException(
            "Release signing is not configured. Provide RELEASE_* env vars or ../keystore.properties before building release."
        )
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    def cameraxVersion = "1.6.1"
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
    implementation "com.google.mlkit:barcode-scanning:17.3.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied.")
}
