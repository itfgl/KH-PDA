<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>凯航扫码 Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #f2f2f7; color: #1c1c1e; }

    .header {
      background: #1c1c1e; color: #fff;
      padding: 16px 20px;
      font-size: 18px; font-weight: 600;
    }

    .section {
      margin: 12px; background: #fff;
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .section-title {
      padding: 14px 16px 10px;
      font-size: 13px; font-weight: 600;
      color: #8e8e93; text-transform: uppercase; letter-spacing: .5px;
    }
    .section-body { padding: 0 16px 16px; }

    .status-bar {
      margin-bottom: 12px; padding: 10px 14px;
      border-radius: 8px; font-size: 14px; line-height: 1.4;
      background: #f2f2f7; color: #3a3a3c; min-height: 42px;
    }
    .status-bar.ok   { background: #d1fae5; color: #065f46; }
    .status-bar.err  { background: #fee2e2; color: #991b1b; }
    .status-bar.info { background: #dbeafe; color: #1e40af; }

    .btn {
      display: inline-block; padding: 10px 20px;
      border-radius: 8px; border: none; cursor: pointer;
      font-size: 15px; font-weight: 500; margin: 4px 4px 0 0;
    }
    .btn-primary { background: #007aff; color: #fff; }
    .btn-success { background: #34c759; color: #fff; }
    .btn-danger  { background: #ff3b30; color: #fff; }
    .btn-gray    { background: #e5e5ea; color: #1c1c1e; }
    .btn-sm      { padding: 6px 12px; font-size: 13px; }
    .btn:active  { opacity: .75; }

    input[type=text] {
      width: 100%; padding: 10px 12px; margin-bottom: 10px;
      border: 1px solid #d1d1d6; border-radius: 8px; font-size: 15px;
    }

    .result-box {
      margin-top: 10px; padding: 10px 12px;
      background: #f2f2f7; border-radius: 8px;
      font-size: 13px; font-family: monospace;
      word-break: break-all; min-height: 36px;
    }

    /* 调试日志 */
    #debug-log {
      margin: 0 12px 20px; background: #1c1c1e;
      border-radius: 12px; overflow: hidden;
    }
    #debug-log .section-title { color: #636366; }
    #debug-log .log-body {
      padding: 0 12px 12px; max-height: 260px; overflow-y: auto;
    }
    .log-line {
      font-family: monospace; font-size: 12px; line-height: 1.6;
      padding: 2px 0; border-bottom: 1px solid #2c2c2e;
      white-space: pre-wrap; word-break: break-all;
    }
    .log-line.info  { color: #64d2ff; }
    .log-line.ok    { color: #30d158; }
    .log-line.err   { color: #ff453a; }
    .log-line.warn  { color: #ffd60a; }
    .log-line.plain { color: #ebebf5; }
  </style>
</head>
<body>

<div class="header">
  凯航扫码 — 功能 Demo
  <div id="build-time" style="font-size:11px;font-weight:400;opacity:0.6;margin-top:2px;">build: 加载中…</div>
</div>

<!-- ── 扫码 ────────────────────────────────────────── -->
<div class="section" id="scan-section">
  <div class="section-title">扫码枪</div>
  <div class="section-body">
    <div class="status-bar" id="scan-status">等待初始化…</div>
    <button class="btn btn-primary" onclick="startScan()">触发扫码</button>
    <button class="btn btn-gray"    onclick="stopScan()">停止</button>
    <div class="result-box" id="scan-result">扫码结果显示在这里</div>
  </div>
</div>

<!-- ── 打印 ────────────────────────────────────────── -->
<div class="section" id="print-section">
  <div class="section-title">标签打印</div>
  <div class="section-body">
    <div class="status-bar" id="print-status">等待连接打印机…</div>
    <input type="text" id="batch-no"     placeholder="批次码（如 M05260604030012）" value="M05260604030012">
    <input type="text" id="machine-id"   placeholder="机器编号" value="M05">
    <input type="text" id="product-type" placeholder="产品类型" value="电容">
    <button class="btn btn-primary" onclick="doPrint()">打印标签</button>
    <button class="btn btn-gray"    onclick="connectPrinter()">重连打印机</button>
  </div>
</div>

<!-- ── NFC ─────────────────────────────────────────── -->
<div class="section">
  <div class="section-title">NFC 读写</div>
  <div class="section-body">
    <div class="status-bar" id="nfc-status">就绪，请选择操作</div>
    <input type="text" id="nfc-write-data" placeholder="写入内容（如批次码）" value="M05260604030012">
    <button class="btn btn-primary" onclick="nfcRead()">读取卡片</button>
    <button class="btn btn-success" onclick="nfcWrite()">写入卡片</button>
    <button class="btn btn-danger"  onclick="nfcCancel()">停止</button>
    <div class="result-box" id="nfc-result">NFC 读取结果显示在这里</div>
  </div>
</div>

<!-- ── 调试日志 ───────────────────────────────────────── -->
<div id="debug-log" class="section">
  <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
    <span>调试日志</span>
    <div>
      <button class="btn btn-gray btn-sm" onclick="copyLog()" style="margin-right:6px;">复制</button>
      <button class="btn btn-gray btn-sm" onclick="clearLog()">清空</button>
    </div>
  </div>
  <div class="log-body" id="log-body"></div>
</div>

<script src="plugins.js"></script>
<script>
  // ── 调试日志 ───────────────────────────────────────────
  const logBody = document.getElementById('log-body');

  window.log = function(msg, type = 'plain') {
    const now = new Date().toTimeString().slice(0, 8);
    const line = document.createElement('div');
    line.className = 'log-line ' + type;
    line.textContent = `[${now}] ${msg}`;
    logBody.appendChild(line);
    logBody.scrollTop = logBody.scrollHeight;
    console.log(`[${type}] ${msg}`);
  };

  window.clearLog = () => { logBody.innerHTML = ''; };

  window.copyLog = () => {
    const lines = [...logBody.querySelectorAll('.log-line')].map(el => el.textContent).join('\n');
    navigator.clipboard.writeText(lines).then(
      () => { const b = document.querySelector('[onclick="copyLog()"]'); b.textContent = '已复制'; setTimeout(() => b.textContent = '复制', 1500); },
      () => alert(lines)  // 降级：弹窗显示
    );
  };

  window.addEventListener('error', e => log('JS ERROR: ' + e.message, 'err'));
  window.addEventListener('unhandledrejection', e => log('UNHANDLED: ' + (e.reason?.message ?? e.reason), 'err'));

  // plugins.js 已把 ScanPlugin / PrintPlugin / NFC 挂到 window
  // 显示构建时间
  const bt = window.BUILD_TIME ? new Date(window.BUILD_TIME).toLocaleString('zh') : '未知';
  document.getElementById('build-time').textContent = 'build: ' + bt;
  log('build: ' + bt, 'plain');
  log('platform=' + (window.Capacitor?.getPlatform?.() ?? 'unknown'), 'info');
  log('ScanPlugin=' + (window.ScanPlugin ? 'ok' : 'missing'), window.ScanPlugin ? 'ok' : 'err');
  log('PrintPlugin=' + (window.PrintPlugin ? 'ok' : 'missing'), window.PrintPlugin ? 'ok' : 'err');
  log('KaihangNfc=' + (window.KaihangNfc ? 'ok' : 'missing'), window.KaihangNfc ? 'ok' : 'err');

  const { ScanPlugin, PrintPlugin, KaihangNfc } = window;
  const NFC_PREFIX = 'kaihang://nfc/';

  // ── 工具 ─────────────────────────────────────────────
  function setStatus(id, msg, type = '') {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = 'status-bar' + (type ? ' ' + type : '');
  }

  // ── 扫码 ──────────────────────────────────────────────
  let scanListener = null;
  let scanAvailable = false;

  async function initScan() {
    log('initScan() 开始…', 'info');
    try {
      scanListener = await ScanPlugin.addListener('scanResult', ({ value }) => {
        log('扫码结果: ' + value, 'ok');
        document.getElementById('scan-result').textContent = value;
        setStatus('scan-status', '扫码成功', 'ok');
      });
      scanAvailable = true;
      setStatus('scan-status', '监听中，等待扫码枪触发', 'info');
      log('扫码监听注册成功', 'ok');
    } catch (e) {
      log('initScan 不可用（非 X8 设备）: ' + e.message, 'warn');
      setStatus('scan-status', '⚠️ 扫码枪仅支持 X8 硬件', '');
      // 禁用按钮
      document.querySelectorAll('#scan-section button').forEach(b => b.disabled = true);
    }
  }

  window.startScan = async () => {
    if (!scanAvailable) return;
    log('startScan()', 'info');
    try { await ScanPlugin.startScan(); } catch(e) { log('startScan 失败: ' + e.message, 'err'); }
  };

  window.stopScan = async () => {
    if (!scanAvailable) return;
    log('stopScan()', 'info');
    await ScanPlugin.stopScan();
    setStatus('scan-status', '已停止');
  };

  // ── 打印 ──────────────────────────────────────────────
  let printListener = null;
  let printAvailable = false;

  window.connectPrinter = async () => {
    log('connectPrinter() 开始…', 'info');
    setStatus('print-status', '连接中…', 'info');
    try {
      if (printListener) { printListener.remove(); printListener = null; }
      printListener = await PrintPlugin.addListener('printStatus', (data) => {
        log('printStatus 回调: ' + JSON.stringify(data), data.connection === 'connected' || data.status === 'PRINT_OK' ? 'ok' : data.connection === 'failed' ? 'err' : 'warn');
        const { connection, status, flag } = data;
        if (connection === 'connected')   { printAvailable = true; setStatus('print-status', '打印机已连接', 'ok'); }
        else if (connection === 'failed') setStatus('print-status', '连接失败', 'err');
        else if (connection === 'closed') setStatus('print-status', '打印机已关闭', 'warn');
        else if (status === 'PRINT_OK')   setStatus('print-status', `打印完成：${flag}`, 'ok');
        else if (status)                  setStatus('print-status', `状态：${status}`, status.includes('FAILED') || status.includes('NO_') ? 'err' : 'info');
      });
      log('printStatus 监听注册成功', 'ok');
      await PrintPlugin.connect();
      log('PrintPlugin.connect() 调用完成', 'info');
    } catch (e) {
      log('connectPrinter 不可用（非 X8 设备）: ' + e.message, 'warn');
      setStatus('print-status', '⚠️ 打印机仅支持 X8 硬件', '');
      document.querySelectorAll('#print-section button').forEach(b => b.disabled = true);
    }
  };

  window.doPrint = async () => {
    if (!printAvailable) { alert('打印机未连接或不支持'); return; }
    const batchNo     = document.getElementById('batch-no').value.trim();
    const machineId   = document.getElementById('machine-id').value.trim();
    const productType = document.getElementById('product-type').value.trim();
    if (!batchNo) { alert('请填写批次码'); return; }
    log(`doPrint() batchNo=${batchNo}`, 'info');
    setStatus('print-status', '发送打印任务…', 'info');
    try {
      await PrintPlugin.prepareToPrintLabel();
      log('prepareToPrintLabel() 完成', 'info');
      await PrintPlugin.printBatchLabel({
        batchNo, machineId, productType,
        date: new Date().toLocaleDateString('zh', { year:'2-digit', month:'2-digit', day:'2-digit' }).replace(/\//g, ''),
      });
      log('printBatchLabel() 调用完成，等待回调…', 'info');
    } catch (e) {
      log('doPrint 异常: ' + e.message, 'err');
      setStatus('print-status', '打印失败：' + e.message, 'err');
    }
  };

  // ── NFC ───────────────────────────────────────────────
  let nfcEventListener = null;
  let nfcMode = null; // 'read' | 'write' | null(待机)

  async function nfcInit() {
    try {
      nfcEventListener = await KaihangNfc.addListener('nfcEvent', handleNfcEvent);
      await KaihangNfc.startScanning();
      log('NFC 前台拦截已激活', 'ok');
      setStatus('nfc-status', '就绪，请选择操作', '');
    } catch(e) {
      log('NFC 初始化失败: ' + e.message, 'err');
      setStatus('nfc-status', 'NFC 初始化失败: ' + e.message, 'err');
    }
  }

  async function handleNfcEvent(event) {
    const { techTypes, isNdef, isMifareUltralight, ndefMessage, mifareData } = event;
    log(`nfcEvent mode=${nfcMode} isNdef=${isNdef} isMifare=${isMifareUltralight}`, 'info');

    if (nfcMode === 'read') {
      let found = null;

      // 优先读 NDEF
      if (isNdef && ndefMessage) {
        for (const r of ndefMessage) {
          if (r.tnf === 1 && new TextDecoder().decode(new Uint8Array(r.type)) === 'U') {
            const uri = new TextDecoder().decode(new Uint8Array(r.payload).slice(1));
            found = uri.startsWith(NFC_PREFIX) ? uri.replace(NFC_PREFIX, '') : uri;
            break;
          }
        }
      }
      // 其次读凯航自定义 Mifare 格式
      if (!found && mifareData) found = mifareData;

      const display = found ?? `未知卡 techTypes=${JSON.stringify(techTypes)}`;
      document.getElementById('nfc-result').textContent = display;
      setStatus('nfc-status', found ? '读取成功' : '读取成功（无凯航数据）', found ? 'ok' : '');
      log('读取结果: ' + display, 'ok');
      nfcMode = null;
      setStatus('nfc-status', '就绪，请选择操作', '');

    } else if (nfcMode === 'write') {
      const content = document.getElementById('nfc-write-data').value.trim();
      log(`写入内容: ${content}，卡类型: isNdef=${isNdef} isMifare=${isMifareUltralight}`, 'info');
      try {
        if (isNdef) {
          // NTAG213/215/216 等 NDEF 卡
          await KaihangNfc.writeNdef({ data: content, allowFormat: true });
          log('NDEF 写入成功', 'ok');
        } else if (isMifareUltralight) {
          // MifareUltralight 原始写入
          await KaihangNfc.writeMifareRaw({ data: content });
          log('MifareUltralight 原始写入成功', 'ok');
        } else {
          throw new Error(`不支持的卡类型: ${JSON.stringify(techTypes)}`);
        }
        setStatus('nfc-status', '写入成功！', 'ok');
      } catch(e) {
        log('写入失败: ' + e.message, 'err');
        setStatus('nfc-status', '写入失败：' + e.message, 'err');
      }
      nfcMode = null;
      setTimeout(() => setStatus('nfc-status', '就绪，请选择操作', ''), 2000);
    }
  }

  async function cancelNfc() {
    nfcMode = null;
  }

  window.nfcCancel = () => {
    nfcMode = null;
    setStatus('nfc-status', '就绪，请选择操作', '');
    log('NFC 模式已取消（scanning 保持激活）', 'info');
  };

  window.nfcRead = () => {
    nfcMode = 'read';
    document.getElementById('nfc-result').textContent = '等待读取…';
    setStatus('nfc-status', '扫描中… 请贴近 NFC 标签', 'info');
    log('nfcRead() 模式已设置，请贴卡', 'info');
  };

  window.nfcWrite = () => {
    const content = document.getElementById('nfc-write-data').value.trim();
    if (!content) { alert('请填写写入内容'); return; }
    nfcMode = 'write';
    setStatus('nfc-status', `准备写入 [${content}]… 请贴近 NFC 标签`, 'info');
    log(`nfcWrite() 模式已设置 content=${content}，请贴卡`, 'info');
  };

  // ── 启动 ──────────────────────────────────────────────
  log('页面初始化开始', 'info');
  if (ScanPlugin)  initScan();
  if (PrintPlugin) connectPrinter();
  if (KaihangNfc)  nfcInit();
</script>

</body>
</html>
