name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 拉取代码
      uses: actions/checkout@v4

    - name: 2. 配置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 3. 配置 Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 4. 安装依赖、构建 JS、同步 Capacitor
      run: |
        npm install
        npm run build
        npx cap sync android

    - name: 5. 编译 Debug APK（可直接装机测试，无需签名配置）
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: 6. 上传 Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: kaihang-scanner-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
