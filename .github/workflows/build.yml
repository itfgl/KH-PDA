name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REMOTE_STATIC_DIR: /opt/scanner/server/static

    steps:
    - name: 1. 拉取代码
      uses: actions/checkout@v4

    - name: 2. 配置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: 3. 配置 Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: 4. 准备 Release 签名
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
        cat > keystore.properties <<EOF
        storeFile=app/release.keystore
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        EOF

    - name: 5. 安装依赖、构建 JS、同步 Capacitor
      run: |
        npm install
        npm run build
        npx cap sync android

    - name: 6. 编译 Release APK
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleRelease

    - name: 7. 生成版本元数据和版本化 APK
      run: |
        rm -rf release-dist
        node scripts/generate-version-json.mjs release-manifest.json release-version.json android/app/build/outputs/apk/release/app-release.apk release-dist

    - name: 8. 读取当前版本 APK 文件名
      run: |
        CURRENT_APK_FILE=$(node -e "const fs=require('fs'); const manifest=JSON.parse(fs.readFileSync('release-manifest.json','utf8')); const current=(manifest.releases||[]).find(item => Number(item.versionCode)===Number(manifest.currentVersionCode)); if(!current||!current.apkFileName){process.exit(1)}; process.stdout.write(current.apkFileName);")
        echo "CURRENT_APK_FILE=${CURRENT_APK_FILE}" >> "$GITHUB_ENV"

    - name: 9. 上传 Release APK 和版本元数据
      uses: actions/upload-artifact@v4
      with:
        name: kaihang-scanner-release
        path: |
          release-dist/${{ env.CURRENT_APK_FILE }}
          release-version.json

    - name: 10. 配置 SSH
      run: |
        chmod 600 ./github_actions_apk
        mkdir -p ~/.ssh
        ssh-keyscan 115.29.178.34 >> ~/.ssh/known_hosts

    - name: 11. 上传当前版本 APK 和版本元数据到服务器
      run: |
        scp -i ./github_actions_apk \
          release-dist/${{ env.CURRENT_APK_FILE }} \
          root@115.29.178.34:${REMOTE_STATIC_DIR}/${{ env.CURRENT_APK_FILE }}
        scp -i ./github_actions_apk \
          release-version.json \
          root@115.29.178.34:${REMOTE_STATIC_DIR}/version.json

    - name: 12. 校验服务器上的版本文件
      run: |
        ssh -i ./github_actions_apk root@115.29.178.34 "ls -l ${REMOTE_STATIC_DIR}/version.json ${REMOTE_STATIC_DIR}/${{ env.CURRENT_APK_FILE }}"
