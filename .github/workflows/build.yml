name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 拉取代码
      uses: actions/checkout@v4

    - name: 2. 配置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 3. 安装 Node 依赖（仅用于 Capacitor Android 模块）
      run: npm ci

    - name: 4. 配置 Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: 5. 编译 Debug APK（远程环境不再构建前端）
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: 6. 上传 Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: kaihang-scanner-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
