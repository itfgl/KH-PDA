name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '.github/**'
      - '.gitignore'
      - 'docs/**'
      - 'scripts/restore-release-signing.ps1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 拉取代码
      uses: actions/checkout@v4

    - name: 2. 配置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: 3. 配置 Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: 4. 准备 Release 签名
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
        cat > keystore.properties <<EOF
        storeFile=app/release.keystore
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        EOF

    - name: 5. 安装依赖、构建 JS、同步 Capacitor
      run: |
        npm install
        npm run build
        npx cap sync android

    - name: 6. 编译 Release APK
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleRelease

    - name: 7. 生成版本元数据目录
      run: |
        rm -rf app-updates
        mkdir -p app-updates
        node scripts/generate-version-json.mjs release-manifest.json app-updates

    - name: 8. 读取当前版本 APK 文件名
      run: |
        CURRENT_APK_FILE=$(node -e "const fs=require('fs'); const manifest=JSON.parse(fs.readFileSync('release-manifest.json','utf8')); const current=(manifest.releases||[]).find(item => Number(item.versionCode)===Number(manifest.currentVersionCode)); if(!current||!current.apkFileName){process.exit(1)}; process.stdout.write(current.apkFileName);")
        echo "CURRENT_APK_FILE=${CURRENT_APK_FILE}" >> "$GITHUB_ENV"
        CURRENT_VERSION_CODE=$(node -e "const fs=require('fs'); const manifest=JSON.parse(fs.readFileSync('release-manifest.json','utf8')); process.stdout.write(String(manifest.currentVersionCode));")
        echo "CURRENT_VERSION_CODE=${CURRENT_VERSION_CODE}" >> "$GITHUB_ENV"

    - name: 9. 整理当前版本 APK 到更新目录
      run: |
        cp android/app/build/outputs/apk/release/app-release.apk ./app-updates/${{ env.CURRENT_APK_FILE }}

    - name: 10. 上传 Release APK 和版本元数据
      uses: actions/upload-artifact@v4
      with:
        name: kaihang-scanner-release
        path: |
          app-updates/*.json
          app-updates/${{ env.CURRENT_APK_FILE }}
