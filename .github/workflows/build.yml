name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 拉取代码
      uses: actions/checkout@v4

    - name: 2. 配置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: 3. 配置 Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: 4. 准备 Release 签名
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
        cat > keystore.properties <<EOF
        storeFile=app/release.keystore
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        EOF

    - name: 5. 安装依赖、构建 JS、同步 Capacitor
      run: |
        npm install
        npm run build
        npx cap sync android

    - name: 6. 编译 Release APK
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleRelease

    - name: 7. 生成版本元数据和版本化 APK
      run: |
        rm -rf release-dist
        node scripts/generate-version-json.mjs release-manifest.json release-version.json android/app/build/outputs/apk/release/app-release.apk release-dist

    - name: 8. 上传 Release APK 和版本元数据
      uses: actions/upload-artifact@v4
      with:
        name: kaihang-scanner-release
        path: |
          release-dist/*.apk
          release-version.json

    - name: 9. 配置 SSH
      run: |
        chmod 600 ./github_actions_apk
        mkdir -p ~/.ssh
        ssh-keyscan 115.29.178.34 >> ~/.ssh/known_hosts

    - name: 10. 上传 APK 和版本元数据到测试机
      run: |
        scp -i ./github_actions_apk \
          release-dist/*.apk \
          root@115.29.178.34:/root/server6/static/
        scp -i ./github_actions_apk \
          release-version.json \
          root@115.29.178.34:/root/server6/static/version.json
