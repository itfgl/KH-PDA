<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565C0"/>
      <stop offset="100%" style="stop-color:#0D47A1"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" fill="url(#shine)"/>

  <!-- 扫码框四角 -->
  <g stroke="#ffffff" stroke-width="52" stroke-linecap="round" fill="none" opacity="0.95">
    <!-- 左上 -->
    <polyline points="200,360 200,200 360,200"/>
    <!-- 右上 -->
    <polyline points="664,200 824,200 824,360"/>
    <!-- 左下 -->
    <polyline points="200,664 200,824 360,824"/>
    <!-- 右下 -->
    <polyline points="664,824 824,824 824,664"/>
  </g>

  <!-- 条形码竖线组（居中） -->
  <g fill="#ffffff" opacity="0.95">
    <!-- 细线 -->
    <rect x="340" y="390" width="24" height="244"/>
    <rect x="384" y="390" width="14" height="244"/>
    <rect x="412" y="390" width="30" height="244"/>
    <rect x="456" y="390" width="16" height="244"/>
    <!-- 粗线 -->
    <rect x="488" y="390" width="44" height="244"/>
    <!-- 细线 -->
    <rect x="546" y="390" width="18" height="244"/>
    <rect x="578" y="390" width="28" height="244"/>
    <rect x="620" y="390" width="14" height="244"/>
    <rect x="648" y="390" width="36" height="244"/>
  </g>

  <!-- 扫描线 -->
  <rect x="200" y="505" width="624" height="14" rx="7" fill="#42A5F5" opacity="0.9"/>

  <!-- NFC 波纹（右下角） -->
  <g stroke="#64B5F6" stroke-width="28" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M710 780 Q755 735 755 690 Q755 645 710 600"/>
    <path d="M758 810 Q820 748 820 690 Q820 632 758 570"/>
  </g>
  <!-- NFC 点 -->
  <circle cx="676" cy="690" r="24" fill="#64B5F6" opacity="0.9"/>
</svg>
